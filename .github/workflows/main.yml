name: CoreELEC Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-coreelec:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # 使用官方推荐的最新稳定版本

    - name: Setup Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io

    - name: Pull CoreELEC builder image
      run: docker pull coreelec/coreelec-builder:latest

    - name: Build CoreELEC Image
      run: |
        docker run \
          --rm \
          -v ${{ github.workspace }}:/home/docker \
          -e PROJECT=Amlogic \
          coreelec/coreelec-builder:latest \
          /bin/bash -c "
            git clone https://github.com/CoreELEC/CoreELEC.git /home/docker/CoreELEC && \
            cd /home/docker/CoreELEC && \
            time(make image -j$(nproc))"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4  # 升级到v4版本
      with:
        name: coreelec-image
        path: ${{ github.workspace }}/CoreELEC/target/*.img
        if-no-files-found: error  # 明确文件缺失处理方式
