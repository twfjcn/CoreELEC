name: CoreELEC Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-coreelec:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Docker
      run: |
        curl -fsSL https://get.docker.com | sudo sh
        sudo usermod -aG docker $USER

    - name: Prepare Workspace
      run: |
        mkdir -p ${{ github.workspace }}/CoreELEC
        sudo chmod -R 777 ${{ github.workspace }}

    - name: Build CoreELEC Image
      run: |
        docker run \
          --rm \
          --user "$(id -u):$(id -g)" \
          -v ${{ github.workspace }}:/home/docker \
          -e PROJECT=Amlogic \
          coreelec/coreelec-builder:latest \
          /bin/bash -c "
            mkdir -p /home/docker/CoreELEC && \
            git clone --depth 1 https://github.com/CoreELEC/CoreELEC.git /home/docker/CoreELEC && \
            cd /home/docker/CoreELEC && \
            time(make image -j$(nproc))"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coreelec-image
        path: ${{ github.workspace }}/CoreELEC/target/*.img
        if-no-files-found: error
