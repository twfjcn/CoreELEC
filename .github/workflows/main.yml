name: CoreELEC Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-coreelec:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Docker
      run: |
        curl -fsSL https://get.docker.com | sudo sh
        sudo usermod -aG docker $USER

    - name: Build CoreELEC Image
      run: |
        docker run \
          --rm \
          --user "$(id -u):$(id -g)" \
          -v "${{ github.workspace }}":/home/docker \
          -e PROJECT=Amlogic \
          -e DEVICE=AMLGX \
          coreelec/coreelec-builder:latest \
          /bin/bash -c "
            set -ex
            rm -rf /home/docker/CoreELEC
            git clone --depth 1 https://github.com/CoreELEC/CoreELEC.git /home/docker/CoreELEC
            cd /home/docker/CoreELEC
            make clean
            ./configure --device=AMLGX
            time make image -j$(nproc)"
            
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coreelec-image
        path: ${{ github.workspace }}/CoreELEC/target/*.img
        if-no-files-found: error
