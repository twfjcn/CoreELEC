name: CoreELEC Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-coreelec:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean Existing Docker
      run: |
        # 清理可能存在的旧版本冲突包
        sudo apt-get remove -y containerd docker.io runc || true
        sudo apt-get autoremove -y

    - name: Install Docker via Official Script
      run: |
        # 使用官方安装脚本避免依赖冲突
        curl -fsSL https://get.docker.com | sudo sh
        sudo usermod -aG docker $USER
        sudo systemctl enable docker

    - name: Verify Docker
      run: |
        docker --version
        docker info

    - name: Pull CoreELEC builder image
      run: docker pull coreelec/coreelec-builder:latest

    - name: Build CoreELEC Image
      run: |
        docker run \
          --rm \
          -v ${{ github.workspace }}:/home/docker \
          -e PROJECT=Amlogic \
          coreelec/coreelec-builder:latest \
          /bin/bash -c "
            git clone https://github.com/CoreELEC/CoreELEC.git /home/docker/CoreELEC && \
            cd /home/docker/CoreELEC && \
            time(make image -j$(nproc))"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coreelec-image
        path: ${{ github.workspace }}/CoreELEC/target/*.img
        if-no-files-found: error
