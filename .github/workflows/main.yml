name: CoreELEC Docker Image Build

on:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Docker image
        run: docker pull coreelec/coreelec-builder:latest

      - name: Run Docker container and build
        run: |
          docker run -v ${{ runner.workspace }}/:/home/docker -h coreelec coreelec/coreelec-builder:latest bash -c '
            sudo apt-get update
            if [ -d "/home/docker/CoreELEC" ]; then
              rm -rf /home/docker/CoreELEC
            fi
            git clone git://github.com/CoreELEC/CoreELEC.git ~/CoreELEC
            cd ~/CoreELEC
            PROJECT=Amlogic /usr/bin/time make image
            # 假设构建完成后 Image.lzo 文件会生成在指定路径
            # 这里你可能需要根据实际情况调整生成 kernel.img 的步骤
            # 以下是一个示例，假设需要将 Image.lzo 转换为 kernel.img
            sudo lzop -d build.CoreELEC-Amlogic.arm-20/build/linux-80dbca5bdc1754007a03bf32cd3638bfda94a640/arch/arm64/boot/Image.lzo -c > kernel.img
          '

      - name: Upload kernel.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel.img    
