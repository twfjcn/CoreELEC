name: CoreELEC Kernel Build

on:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential

      - name: Clone CoreELEC repository
        run: git clone git://github.com/CoreELEC/CoreELEC.git ~/CoreELEC

      - name: Navigate to CoreELEC directory
        run: cd ~/CoreELEC

      - name: Build CoreELEC image
        run: |
          PROJECT=Amlogic-ng ARCH=arm make image
          # 假设构建完成后 Image.lzo 文件会生成在指定路径
          # 这里你可能需要根据实际情况调整生成 kernel.img 的步骤
          # 以下是一个示例，假设需要将 Image.lzo 转换为 kernel.img
          lzop -d build.CoreELEC-Amlogic-ne.arm-20/build/linux-80dbca5bdc1754007a03bf32cd3638bfda94a640/arch/arm64/boot/Image.lzo -c > kernel.img

      - name: Upload kernel.img as artifact
        uses: actions/upload-artifact@v3
        with:
          name: kernel-image
          path: kernel.img    
