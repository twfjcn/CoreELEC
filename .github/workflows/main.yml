name: CoreELEC Build

on:
  push:
    branches:
      - main  # 当 main 分支有推送时触发工作流

jobs:
  build-coreelec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Pull CoreELEC builder Docker image
        run: docker pull coreelec/coreelec-builder:latest

      - name: Run CoreELEC builder container and build image
        run: |
          docker run -v $(pwd):/home/docker -h coreelec -it coreelec/coreelec-builder:latest /bin/bash << EOF
          sudo apt-get update
          git clone git://github.com/CoreELEC/CoreELEC.git ~/CoreELEC
          cd ~/CoreELEC
          time make image PROJECT=Amlogic
          EOF
    
