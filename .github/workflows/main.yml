name: CoreELEC Kernel Build

on:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clean up cache
        run: |
          rm -rf ~/.cache/act/actions/actions-upload-artifact

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc flex bison xfonts-utils rdfind libparse-yapp-perl gperf xsltproc patchutils lzop libxml-parser-perl

      - name: Clone CoreELEC repository
        run: git clone https://github.com/twfjcn/CoreELEC.git ~/CoreELEC

      - name: Navigate to CoreELEC directory
        run: cd ~/CoreELEC

      - name: Remove invalid dependency (if possible)
        run: |
          # 假设依赖项在 config/packages/linux-drivers 中
          # 此命令会移除包含 gpu-aml 的行
          sed -i '/gpu-aml/d' config/packages/linux-drivers
        continue-on-error: true

      - name: Clean build cache
        run: |
          cd ~/CoreELEC
          make clean

      - name: Build CoreELEC image
        run: |
          PROJECT=Amlogic DEVICE=AMLGX ARCH=arm make image
          # 假设构建完成后 Image.lzo 文件会生成在指定路径
          # 这里你可能需要根据实际情况调整生成 kernel.img 的步骤
          # 以下是一个示例，假设需要将 Image.lzo 转换为 kernel.img
          lzop -d build.CoreELEC-Amlogic.arm-20/build/linux-80dbca5bdc1754007a03bf32cd3638bfda94a640/arch/arm64/boot/Image.lzo -c > kernel.img

      - name: Upload kernel.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel.img
    
